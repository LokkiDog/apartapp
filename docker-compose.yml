name: aparts

services:
  postgres-aparts:
    container_name: postgres-aparts
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aparts
      POSTGRES_USER: aparts
      POSTGRES_PASSWORD: aparts
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aparts -d aparts"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-magicmop:
    container_name: postgres-magicmop
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: magicmop
      POSTGRES_USER: magicmop
      POSTGRES_PASSWORD: ${MAGICMOP_POSTGRES_PASSWORD:-magicmop}
    ports:
      - "127.0.0.1:52951:5432"
    volumes:
      - magicmop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magicmop -d magicmop"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  magicmop_postgres_data:
