name: Deploy production

on:
  push:
    branches:
      - main
      - aparts
      - magicmop
  pull_request:
  workflow_dispatch:

concurrency:
  group: crm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRM_BRAND: ${{ github.ref_name == 'magicmop' && 'magicmop' || 'aparts' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production Compose configurations
        run: npm run check:compose

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Check guest website
        run: npm run typecheck:guest && npm run build:guest

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/aparts' || github.ref == 'refs/heads/magicmop'
    environment: ${{ github.ref_name == 'magicmop' && 'magicmop-production' || 'production' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || (github.ref_name == 'magicmop' && '/home/magicmop-crm' || '/home/aparts-bansko') }}
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_SSH_PRIVATE_KEY \
            DEPLOY_KNOWN_HOSTS
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing from the production environment secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact commit
        run: |
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sh -s -- '$DEPLOY_PATH' '$GITHUB_REF_NAME' '$GITHUB_SHA'" <<'SH'
          set -eu
          cd "$1"
          branch=$2
          sha=$3
          case "$branch" in aparts|magicmop) ;; *) exit 2 ;; esac
          state="/var/lib/aparts-deploy/$branch"
          test "$(cat "$state/checkout")" = "$(pwd -P)"
          exec 8>"$state/checkout.lock"
          flock 8
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin "refs/heads/$branch"
          if [ "$sha" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Skipping superseded release $sha from $branch."
            exit 0
          fi
          git checkout --detach "$sha"
          ./deploy/deploy.sh "$branch" "$sha"
          SH
