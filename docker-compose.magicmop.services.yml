services:
  postgres:
    extends:
      file: ./docker-compose.prod.services.yml
      service: postgres
    ports: !reset []

  migrate:
    extends:
      file: ./docker-compose.prod.services.yml
      service: migrate

  app:
    extends:
      file: ./docker-compose.prod.services.yml
      service: app
    build:
      args:
        CRM_BRAND: ${CRM_DEPLOY_BRAND:-magicmop}
    ports: !override
      - "127.0.0.1:3002:3000"

  guest:
    extends:
      file: ./docker-compose.prod.services.yml
      service: guest
    profiles: ["aparts-only"]

networks:
  backend: {}

volumes:
  postgres_data:
  uploads_data:
