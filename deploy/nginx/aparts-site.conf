server {
    listen 80;
    listen [::]:80;
    server_name aparts-bansko.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aparts-bansko.com;

    ssl_certificate /etc/letsencrypt/live/aparts-bansko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aparts-bansko.com/privkey.pem;

    root /var/www/aparts-bansko;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
